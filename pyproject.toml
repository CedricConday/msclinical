[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msclinical"
version = "0.1.0"
description = "Multiple sclerosis clinical rules in one package: confirmed disability and cognitive worsening, RAW/PIRA/PIRMA, NEDA, relapse hygiene, treatment epochs, EDSS noise, definition multiverse, table schema, feasibility, Table 1, report parsing, and simulated cohorts with known truth."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["multiple sclerosis"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Medical Science Apps."]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "tabulate"]

[project.urls]
Homepage = "https://github.com/CedricConday/msclinical"

[project.scripts]
msclinical = "msclinical.cli:main"

[tool.setuptools.packages.find]
include = ["msclinical*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
